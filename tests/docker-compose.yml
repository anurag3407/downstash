# @file tests/docker-compose.yml
# Redis + Serverless-Redis-HTTP for the differential/compat suites (§14.1).
# Start with: docker compose -f tests/docker-compose.yml up -d
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - '8079:80'
    depends_on:
      - redis
